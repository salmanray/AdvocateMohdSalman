<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My dashboard | Mohd Salman</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="top"><nav class="nav"><a class="brand" href="/">MOHD SALMAN | LAW & TECHNOLOGY</a><div class="navlinks"><a href="/">Home</a><button id="logout" class="btn secondary">Logout</button></div></nav></header><main class="wrap"><h1>My legal enquiries</h1><p id="welcome" class="muted">Checking your account…</p><section class="card"><h2>Submit a private enquiry</h2><div id="msg" aria-live="polite"></div><form id="form"><div class="field"><label for="subject">Subject</label><input id="subject" name="subject" required minlength="3" maxlength="180"></div><div class="field"><label for="category">Category</label><select id="category" name="category"><option value="">Select category</option><option>Criminal Law</option><option>Cyber Law</option><option>Civil Matters</option><option>Labour & Employment</option><option>Matrimonial & Family</option><option>Other</option></select></div><div class="field"><label for="description">Describe your enquiry (do not submit highly sensitive documents here)</label><textarea id="description" name="description" required minlength="20" maxlength="10000"></textarea></div><button type="submit">Submit enquiry</button></form></section><section><h2>Your submissions</h2><div id="list">Loading…</div></section></main><script src="/assets/app.js"></script><script>
async function refresh(){const me=await api("/api/auth/me");document.querySelector("#welcome").textContent=`Welcome, ${me.user.full_name} (${me.user.role})`;const data=await api("/api/enquiries");const list=document.querySelector("#list");list.replaceChildren();if(!data.enquiries.length){list.textContent="You have not submitted any enquiries yet.";return}for(const item of data.enquiries){const box=document.createElement("article");box.className="item";const h=document.createElement("h3");h.textContent=item.subject;const p=document.createElement("p");p.textContent=item.description;const tag=document.createElement("span");tag.className="tag";tag.textContent=item.status;const link=document.createElement("a");link.href=`/enquiry.html?id=${encodeURIComponent(item.id)}`;link.textContent="Open conversation";box.append(h,tag,p,link);list.append(box)}}
document.querySelector("#form").addEventListener("submit",async e=>{e.preventDefault();const msg=document.querySelector("#msg");try{await api("/api/enquiries","POST",Object.fromEntries(new FormData(e.currentTarget)));e.currentTarget.reset();message(msg,"Enquiry submitted successfully.","success");await refresh()}catch(err){message(msg,err.message,"error")}});
document.querySelector("#logout").onclick=async()=>{try{await api("/api/auth/logout","POST",{});location.href="/login.html"}catch(e){alert(e.message)}};
refresh().catch(()=>location.href="/login.html");
</script></body></html>
