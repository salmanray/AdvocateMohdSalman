<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Mohd Salman</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="top"><nav class="nav"><a class="brand" href="/">MOHD SALMAN | LAW & TECHNOLOGY</a><div class="navlinks"><a href="/register.html">Register</a><a href="/">Home</a></div></nav></header><main class="wrap"><section class="card" style="max-width:520px;margin:auto"><h1>Login</h1><p class="muted">Access your private legal enquiries.</p><div id="msg" aria-live="polite"></div><form id="form"><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password"></div><button type="submit">Login</button></form><p class="muted">New here? <a href="/register.html">Create an account</a></p></section></main><script src="/assets/app.js"></script><script>
document.querySelector("#form").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const msg=document.querySelector("#msg");try{await api("/api/auth/login","POST",Object.fromEntries(f));message(msg,"Login successful. Opening dashboard…","success");location.href="/dashboard.html"}catch(err){message(msg,err.message,"error")}});
</script></body></html>
