<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin enquiries | Mohd Salman</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="top"><nav class="nav"><a class="brand" href="/">MOHD SALMAN | LAW & TECHNOLOGY</a><div class="navlinks"><a href="/dashboard.html">User dashboard</a><button id="logout" class="btn secondary">Logout</button></div></nav></header><main class="wrap"><h1>Admin — all enquiries</h1><p class="muted">This page is restricted by the server to accounts whose database role is admin.</p><div id="msg" aria-live="polite"></div><div id="list">Loading…</div></main><script src="/assets/app.js"></script><script>
async function load(){const me=await api("/api/auth/me");if(me.user.role!=="admin"){document.querySelector("#list").textContent="Access denied.";return}const data=await api("/api/enquiries");const root=document.querySelector("#list");root.replaceChildren();for(const e of data.enquiries){const box=document.createElement("article");box.className="item";const h=document.createElement("h3");h.textContent=e.subject;const meta=document.createElement("p");meta.textContent=`${e.user_name} · ${e.user_email} · ${e.status}`;const p=document.createElement("p");p.textContent=e.description;const a=document.createElement("a");a.href=`/enquiry.html?id=${encodeURIComponent(e.id)}`;a.textContent="Open and reply";box.append(h,meta,p,a);root.append(box)}}document.querySelector("#logout").onclick=async()=>{await api("/api/auth/logout","POST",{});location.href="/login.html"};load().catch(()=>location.href="/login.html");
</script></body></html>
