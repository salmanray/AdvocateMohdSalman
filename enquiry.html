<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enquiry conversation | Mohd Salman</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="top"><nav class="nav"><a class="brand" href="/">MOHD SALMAN | LAW & TECHNOLOGY</a><div class="navlinks"><a href="/dashboard.html">Dashboard</a></div></nav></header><main class="wrap"><h1>Enquiry conversation</h1><p class="muted">Only the enquiry owner and authorised admin can view this conversation.</p><div id="msg" aria-live="polite"></div><div id="messages"></div><section class="card"><form id="form"><div class="field"><label for="message">Message</label><textarea id="message" name="message" required maxlength="10000"></textarea></div><button>Send message</button></form></section></main><script src="/assets/app.js"></script><script>
const id=new URLSearchParams(location.search).get("id");if(!id)location.href="/dashboard.html";
async function refresh(){const data=await api(`/api/enquiries/${encodeURIComponent(id)}/messages`);const root=document.querySelector("#messages");root.replaceChildren();for(const m of data.messages){const box=document.createElement("article");box.className="item";const title=document.createElement("strong");title.textContent=`${m.sender_name||m.sender_type} · ${new Date(m.created_at).toLocaleString()}`;const p=document.createElement("p");p.textContent=m.message;box.append(title,p);root.append(box)}}
document.querySelector("#form").onsubmit=async e=>{e.preventDefault();try{await api(`/api/enquiries/${encodeURIComponent(id)}/messages`,"POST",{message:document.querySelector("#message").value});e.currentTarget.reset();await refresh()}catch(err){message(document.querySelector("#msg"),err.message,"error")}};
refresh().catch(()=>location.href="/login.html");
</script></body></html>
