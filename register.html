<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Mohd Salman</title><link rel="stylesheet" href="/app.css"></head><body><header class="top"><nav class="nav"><a class="brand" href="/">MOHD SALMAN | LAW & TECHNOLOGY</a><div class="navlinks"><a href="/login.html">Login</a><a href="/">Home</a></div></nav></header><main class="wrap"><section class="card" style="max-width:560px;margin:auto"><h1>Create your account</h1><p class="muted">Register to submit and track private legal enquiries.</p><div id="msg" aria-live="polite"></div><form id="form"><div class="field"><label for="name">Full name</label><input id="name" name="full_name" required minlength="2" maxlength="120" autocomplete="name"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="email"></div><div class="field"><label for="phone">Phone (optional)</label><input id="phone" name="phone" maxlength="20" autocomplete="tel"></div><div class="field"><label for="password">Password (minimum 12 characters)</label><input id="password" name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></div><button type="submit">Create account</button></form><p class="muted">Already registered? <a href="/login.html">Login</a></p></section></main><script src="/app.js"></script><script>
document.querySelector("#form").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const msg=document.querySelector("#msg");try{await api("/api/auth/register","POST",Object.fromEntries(f));message(msg,"Account created. Opening your dashboard…","success");location.href="/dashboard.html"}catch(err){message(msg,err.message,"error")}});
</script></body></html>
